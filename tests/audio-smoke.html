<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Cadet audio mixer smoke test</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #02070e; color: #c8e9ff; font: 14px/1.5 monospace; }
    #game { display: block; width: 600px; height: 416px; }
    #result { white-space: pre-wrap; padding: 12px; }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="416"></canvas>
  <pre id="result">RUNNING…</pre>
  <script src="../app.js?test=1"></script>
  <script>
    (() => {
      'use strict';
      const results = [];
      const audio = window.spaceCadetAudio;
      const input = window.spaceCadetInput;
      const test = window.spaceCadetTest;
      const check = (name, pass, detail = '') => results.push({ name, pass: Boolean(pass), detail });
      const fire = code => window.dispatchEvent(new KeyboardEvent('keydown', { code, key: code }));
      function run() {
        check('audio mixer exposes support and locked state', typeof audio.supported === 'boolean' && audio.state === 'locked');
        fire('Enter');
        // The production input edge defers AudioContext construction so it
        // cannot delay a flipper. Exercise the trusted unlock path directly
        // in this deterministic mixer test.
        window.spaceCadetAudioUnlock();
        test.step(0.02);
        check('user gesture unlocks the mixer', audio.unlocked && audio.context && audio.master && audio.buses.sfx && audio.buses.ui);
        fire('KeyM');
        check('mute toggle updates mixer gain', input.muted && audio.muted && audio.gainTarget === 0);
        fire('KeyM');
        check('unmute restores configured volume', !input.muted && !audio.muted && audio.master.gain.value > 0);
        check('audio state is observable for later sound stages', ['running', 'suspended', 'locked', 'unsupported', 'error'].includes(audio.state));

        const passed = results.every(result => result.pass);
        const lines = results.map(result => `${result.pass ? 'PASS' : 'FAIL'}  ${result.name}${result.detail ? ` — ${result.detail}` : ''}`);
        document.body.dataset.smoke = passed ? 'pass' : 'fail';
        document.getElementById('result').textContent = `${passed ? 'PASS' : 'FAIL'}\n\n${lines.join('\n')}`;
      }
      try { run(); } catch (error) {
        document.body.dataset.smoke = 'error';
        document.getElementById('result').textContent = `ERROR\n\n${error.stack || error}`;
      }
    })();
  </script>
</body>
</html>

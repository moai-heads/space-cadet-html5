<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Cadet real animation-loop smoke test</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; height: 100%; background: #02070e; }
    body { overflow: hidden; color: #c8e9ff; font: 14px/1.5 monospace; }
    #gameframe { display: block; width: 900px; height: 624px; border: 0; }
    #result { position: fixed; inset: 0 auto auto 0; margin: 0; padding: 8px; background: rgba(0,0,0,.84); white-space: pre-wrap; }
  </style>
</head>
<body>
  <iframe id="gameframe" title="Space Cadet live loop" src="../index.html?loop-test=1"></iframe>
  <pre id="result">RUNNING…</pre>
  <script>
    (() => {
      'use strict';
      const results = [];
      const check = (name, pass, detail = '') => results.push({ name, pass: Boolean(pass), detail });
      const frame = document.getElementById('gameframe');
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

      function waitForGameFrame(timeoutMs = 2500) {
        return new Promise((resolve, reject) => {
          const startedAt = performance.now();
          const poll = () => {
            const doc = frame.contentDocument;
            const win = frame.contentWindow;
            const canvas = doc && doc.getElementById('game');
            if (doc && doc.readyState === 'complete' && canvas && win.spaceCadetRender) {
              resolve();
              return;
            }
            if (performance.now() - startedAt >= timeoutMs) {
              reject(new Error('iframe game did not expose its runtime before timeout'));
              return;
            }
            setTimeout(poll, 10);
          };
          frame.addEventListener('load', poll, { once: true });
          poll();
        });
      }

      async function run() {
        await waitForGameFrame();
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const canvas = doc.getElementById('game');
        const render = win.spaceCadetRender;
        check('live game frame loads', Boolean(canvas && render));
        check('backing surface stays at retro resolution', canvas.width <= 600 && canvas.height <= 416,
          `${canvas.width}x${canvas.height}`);
        check('low-latency context is requested', render.tuning.desynchronized === true);

        await wait(120);
        const frameStart = render.frames;
        const timeStart = performance.now();
        await wait(1000);
        const frameCount = render.frames - frameStart;
        const elapsed = performance.now() - timeStart;
        check('live animation loop is actually running', frameCount >= 30,
          `${frameCount} frames/${elapsed.toFixed(0)}ms`);
        check('live canvas stays within the 50ms frame budget', frameCount > 0 && elapsed / frameCount < 50,
          `${(elapsed / Math.max(1, frameCount)).toFixed(2)}ms average`);

        const flipper = win.spaceCadetFlippers.left;
        const input = win.spaceCadetInput;
        const before = flipper.angle;
        const inputStart = performance.now();
        win.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyZ', key: 'z', bubbles: true, cancelable: true }));
        const syncMs = performance.now() - inputStart;
        check('flipper input state changes synchronously', input.left && syncMs < 10, `${syncMs.toFixed(2)}ms`);
        const responseStart = performance.now();
        await wait(90);
        const responseMs = performance.now() - responseStart;
        win.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyZ', key: 'z', bubbles: true, cancelable: true }));
        check('flipper begins moving within 100ms', flipper.angle !== before && responseMs < 100, `${responseMs.toFixed(2)}ms`);

        const passed = results.every(result => result.pass);
        const lines = results.map(result => `${result.pass ? 'PASS' : 'FAIL'}  ${result.name}${result.detail ? ` — ${result.detail}` : ''}`);
        document.body.dataset.smoke = passed ? 'pass' : 'fail';
        document.getElementById('result').textContent = `${passed ? 'PASS' : 'FAIL'}\n\n${lines.join('\n')}`;
      }

      run().catch(error => {
        document.body.dataset.smoke = 'error';
        document.getElementById('result').textContent = `ERROR\n\n${error.stack || error}`;
      });
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101d">
  <title>3D Pinball — Space Cadet (HTML5)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #02050a; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #c8e9ff;
      background:
        radial-gradient(ellipse at 50% 15%, rgba(21,74,119,.32), transparent 50%),
        linear-gradient(135deg, #010207 0%, #071321 48%, #02050b 100%);
    }
    #wrap {
      width: min(1120px, calc(100vw - 24px), calc((100svh - 72px) * 1.4423077));
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    #screen {
      width: 100%;
      aspect-ratio: 600 / 416;
      position: relative;
      border: 1px solid #1c5a7d;
      border-radius: 8px;
      background: #02070e;
      box-shadow:
        0 0 0 2px #071828,
        0 0 28px rgba(0, 149, 255, .16),
        0 22px 60px rgba(0,0,0,.75);
      overflow: hidden;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 6px;
      background: #02070e;
      touch-action: none;
      user-select: none;
      cursor: crosshair;
    }
    .caption {
      width: 100%;
      text-align: center;
      color: #77a8c7;
      font: 12px/1.2 Consolas, monospace;
      letter-spacing: .04em;
      opacity: .85;
    }
    .caption b { color: #e4bd54; font-weight: 700; }
    @media (max-width: 700px) {
      body { padding: max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left)); }
      #wrap { width: min(calc(100vw - 16px), calc((100svh - 58px) * 1.4423077)); gap: 6px; }
      .caption { font-size: 9px; letter-spacing: 0; }
    }
  </style>
</head>
<body>
  <main id="wrap">
    <div id="screen">
      <canvas id="game" width="600" height="416" tabindex="0" role="application" aria-label="Space Cadet pinball game" aria-keyshortcuts="Z ShiftLeft Slash ShiftRight Space A D ArrowLeft ArrowRight P H M Enter"></canvas>
    </div>
    <div class="caption"><b>Z / LEFT SHIFT</b> left flipper&nbsp; · &nbsp;<b>/ / RIGHT SHIFT</b> right flipper&nbsp; · &nbsp;<b>SPACE</b> launch&nbsp; · &nbsp;<b>A/D or ARROWS</b> nudge&nbsp; · &nbsp;<b>P</b> pause&nbsp; · &nbsp;<b>H</b> help</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
